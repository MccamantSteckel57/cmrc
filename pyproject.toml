[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coupled-monotone-risk"
version = "1.0.0"
description = "Coupled monotone risk control for structured financial prediction"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "The CMRC authors" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "torch>=2.2",
  "xlrd>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.6", "black>=24.4", "isort>=5.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coupled_monotone_risk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 96
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.black]
line-length = 96
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 96
known_first_party = ["coupled_monotone_risk"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = []

[[tool.mypy.overrides]]
module = ["pandas.*", "xlrd.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true
